version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shop-postgres-dev
    environment:
      POSTGRES_USER: wetechar
      POSTGRES_PASSWORD: wetechar
      POSTGRES_DB: shop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wetechar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
